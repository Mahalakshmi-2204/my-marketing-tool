<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Free Meta Tag Checker. Analyze title, meta description, canonical, robots, Open Graph and Twitter tags."
    />

    <title>Free Meta Tag Checker | GrowthKit</title>

    <link rel="stylesheet" href="../style.css" />

    <style>
      .tool-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 80px 24px 100px;
      }

      .tool-header {
        text-align: center;
        margin-bottom: 45px;
      }

      .tool-header h1 {
        font-size: clamp(38px, 6vw, 58px);
        line-height: 1.1;
        letter-spacing: -2px;
        margin-bottom: 18px;
      }

      .tool-header h1 span {
        color: var(--primary);
      }

      .tool-header p {
        max-width: 680px;
        margin: auto;
        color: var(--text-secondary);
        font-size: 16px;
      }

      .checker-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px;
        box-shadow: var(--shadow);
      }

      .checker-box label {
        display: block;
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 700;
      }

      .url-row {
        display: flex;
        gap: 10px;
      }

      .url-input {
        flex: 1;
        min-width: 0;
        padding: 14px 15px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }

      .url-input:focus {
        border-color: var(--primary);
      }

      .check-button {
        padding: 0 22px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .check-button:hover {
        opacity: 0.9;
      }

      .check-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .alternative {
        margin-top: 12px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .alternative button {
        padding: 0;
        border: none;
        background: none;
        color: var(--primary);
        text-decoration: underline;
        cursor: pointer;
        font-size: 13px;
      }

      .paste-area {
        display: none;
        margin-top: 22px;
      }

      .paste-area textarea {
        width: 100%;
        min-height: 180px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        font-family: monospace;
        font-size: 13px;
        resize: vertical;
        outline: none;
      }

      .paste-area textarea:focus {
        border-color: var(--primary);
      }

      .analyze-button {
        margin-top: 10px;
        padding: 10px 17px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
      }

      .status-message {
        min-height: 20px;
        margin: 25px 0 15px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .status-message.error {
        color: #b42318;
      }

      .score-box {
        display: none;
        align-items: center;
        gap: 20px;
        padding: 22px;
        margin-bottom: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .score {
        min-width: 70px;
        color: var(--primary);
        font-size: 38px;
        font-weight: 800;
      }

      .score-info strong {
        display: block;
        margin-bottom: 4px;
      }

      .score-info span {
        color: var(--text-secondary);
        font-size: 13px;
      }

      .results {
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .result-card {
        padding: 17px;
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--border);
        border-radius: 10px;
      }

      .result-card.pass {
        border-left-color: #4a7c59;
      }

      .result-card.warning {
        border-left-color: #b8935a;
      }

      .result-card.missing {
        border-left-color: #a8503f;
      }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }

      .result-name {
        font-size: 14px;
        font-weight: 700;
      }

      .result-status {
        padding: 4px 9px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .pass .result-status {
        color: #4a7c59;
        background: rgba(74, 124, 89, 0.12);
      }

      .warning .result-status {
        color: #9a783e;
        background: rgba(184, 147, 90, 0.15);
      }

      .missing .result-status {
        color: #a8503f;
        background: rgba(168, 80, 63, 0.12);
      }

      .result-value {
        margin-top: 9px;
        padding: 9px 11px;
        border-radius: 7px;
        background: var(--bg);
        color: var(--text);
        font-family: monospace;
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .result-note {
        margin-top: 7px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .back-link {
        display: inline-block;
        margin-top: 30px;
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
      }

      @media (max-width: 600px) {
        .url-row {
          flex-direction: column;
        }

        .check-button {
          min-height: 46px;
        }

        .checker-box {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div id="header"></div>
    <main class="tool-page">
      <div class="tool-header">
        <span class="section-label"> FREE SEO TOOL </span>

        <h1>Meta Tag <span>Checker</span></h1>

        <p>
          Check your webpage's title, meta description, canonical, robots, Open
          Graph and Twitter tags. Get quick SEO pass, warning and missing
          results.
        </p>
      </div>

      <div class="checker-box">
        <label for="urlInput"> Enter webpage URL </label>

        <div class="url-row">
          <input
            type="url"
            id="urlInput"
            class="url-input"
            placeholder="https://example.com"
          />

          <button id="checkButton" class="check-button" onclick="checkURL()">
            Check Tags
          </button>
        </div>

        <p class="alternative">
          Having trouble fetching a website?
          <button onclick="showPasteArea()">Paste HTML source instead</button>
        </p>

        <div class="paste-area" id="pasteArea">
          <textarea
            id="htmlInput"
            placeholder="Paste your webpage HTML source here..."
          ></textarea>

          <button class="analyze-button" onclick="analyzePastedHTML()">
            Analyze HTML
          </button>
        </div>
      </div>

      <p id="statusMessage" class="status-message"></p>

      <div id="scoreBox" class="score-box">
        <div id="score" class="score">0</div>

        <div class="score-info">
          <strong> SEO Tag Score </strong>

          <span id="scoreDescription"> Based on the checks below. </span>
        </div>
      </div>

      <div id="results" class="results"></div>

      <a href="../index.html" class="back-link"> ← Back to GrowthKit </a>
    </main>
    <div id="footer"></div>

    <script src="../script.js"></script>

    <script>
      async function checkURL() {
        const input = document.getElementById("urlInput");

        const button = document.getElementById("checkButton");

        const url = input.value.trim();

        if (!url) {
          setStatus("Please enter a webpage URL.", true);

          return;
        }

        try {
          new URL(url);
        } catch {
          setStatus("Please enter a valid URL.", true);

          return;
        }

        button.disabled = true;
        button.textContent = "Checking...";

        setStatus("Fetching webpage...");

        try {
          const proxy =
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);

          const response = await fetch(proxy);

          if (!response.ok) {
            throw new Error("Unable to fetch page");
          }

          const html = await response.text();

          analyzeHTML(html, url);

          setStatus("Analysis completed.");
        } catch (error) {
          setStatus(
            "Unable to fetch this webpage automatically. The website may block external requests. Try the HTML source option below.",
            true,
          );
        } finally {
          button.disabled = false;
          button.textContent = "Check Tags";
        }
      }

      function showPasteArea() {
        document.getElementById("pasteArea").style.display = "block";
      }

      function analyzePastedHTML() {
        const html = document.getElementById("htmlInput").value.trim();

        if (!html) {
          setStatus("Please paste HTML source first.", true);

          return;
        }

        analyzeHTML(html, "Pasted HTML");

        setStatus("HTML source analyzed successfully.");
      }

      function setStatus(message, error = false) {
        const element = document.getElementById("statusMessage");

        element.textContent = message;

        element.className = error ? "status-message error" : "status-message";
      }

      function getMeta(documentObject, selector) {
        const element = documentObject.querySelector(selector);

        if (!element) {
          return null;
        }

        return element.getAttribute("content")?.trim() || null;
      }

      function analyzeHTML(html, source) {
        const parser = new DOMParser();

        const documentObject = parser.parseFromString(html, "text/html");

        const title =
          documentObject.querySelector("title")?.textContent?.trim() || null;

        const description = getMeta(documentObject, 'meta[name="description"]');

        const canonical =
          documentObject
            .querySelector('link[rel="canonical"]')
            ?.getAttribute("href")
            ?.trim() || null;

        const robots = getMeta(documentObject, 'meta[name="robots"]');

        const viewport = getMeta(documentObject, 'meta[name="viewport"]');

        const ogTitle = getMeta(documentObject, 'meta[property="og:title"]');

        const ogDescription = getMeta(
          documentObject,
          'meta[property="og:description"]',
        );

        const ogImage = getMeta(documentObject, 'meta[property="og:image"]');

        const ogType = getMeta(documentObject, 'meta[property="og:type"]');

        const twitterCard = getMeta(
          documentObject,
          'meta[name="twitter:card"]',
        );

        const twitterTitle = getMeta(
          documentObject,
          'meta[name="twitter:title"]',
        );

        const twitterImage = getMeta(
          documentObject,
          'meta[name="twitter:image"]',
        );

        const checks = [];

        checks.push(
          lengthCheck(
            "Title Tag",
            title,
            30,
            60,
            "Aim for approximately 30–60 characters.",
          ),
        );

        checks.push(
          lengthCheck(
            "Meta Description",
            description,
            70,
            160,
            "Aim for approximately 70–160 characters.",
          ),
        );

        checks.push(
          existsCheck(
            "Canonical URL",
            canonical,
            "Helps specify the preferred version of a page.",
          ),
        );

        checks.push(
          existsCheck(
            "Viewport Tag",
            viewport,
            "Important for responsive mobile rendering.",
          ),
        );

        checks.push(robotsCheck(robots));

        checks.push(
          existsCheck(
            "Open Graph Title",
            ogTitle,
            "Used for social sharing previews.",
          ),
        );

        checks.push(
          existsCheck(
            "Open Graph Description",
            ogDescription,
            "Provides description text for social shares.",
          ),
        );

        checks.push(
          existsCheck(
            "Open Graph Image",
            ogImage,
            "Provides an image for social sharing previews.",
          ),
        );

        checks.push(
          existsCheck(
            "Open Graph Type",
            ogType,
            "Defines the type of shared content.",
          ),
        );

        checks.push(
          existsCheck(
            "Twitter Card",
            twitterCard,
            "Controls the Twitter/X sharing card.",
          ),
        );

        checks.push(existsCheck("Twitter Title", twitterTitle));

        checks.push(existsCheck("Twitter Image", twitterImage));

        const passed = checks.filter((item) => item.status === "pass").length;

        const score = Math.round((passed / checks.length) * 100);

        displayScore(score, passed, checks.length, source);

        displayResults(checks);
      }

      function lengthCheck(name, value, min, max, note) {
        if (!value) {
          return {
            name,
            status: "missing",
            value: null,
            note: "Tag not found. " + note,
          };
        }

        const length = value.length;

        if (length >= min && length <= max) {
          return {
            name,
            status: "pass",
            value,
            note: length + " characters. Good length.",
          };
        }

        return {
          name,
          status: "warning",
          value,
          note: length + " characters. " + note,
        };
      }

      function existsCheck(name, value, note = "") {
        if (!value) {
          return {
            name,
            status: "missing",
            value: null,
            note: "Tag not found." + (note ? " " + note : ""),
          };
        }

        return {
          name,
          status: "pass",
          value,
          note,
        };
      }

      function robotsCheck(value) {
        if (!value) {
          return {
            name: "Robots Meta",
            status: "warning",
            value: null,
            note: "No robots meta tag found. Search engines generally use their default crawling behavior.",
          };
        }

        if (/noindex/i.test(value)) {
          return {
            name: "Robots Meta",
            status: "warning",
            value,
            note: "This page contains noindex.",
          };
        }

        return {
          name: "Robots Meta",
          status: "pass",
          value,
          note: "Robots meta tag found.",
        };
      }

      function displayScore(score, passed, total, source) {
        document.getElementById("score").textContent = score;

        document.getElementById("scoreDescription").textContent =
          `${passed} of ${total} checks passed for ${source}.`;

        document.getElementById("scoreBox").style.display = "flex";
      }

      function displayResults(checks) {
        const container = document.getElementById("results");

        container.innerHTML = "";

        checks.forEach((check) => {
          const card = document.createElement("div");

          card.className = "result-card " + check.status;

          let statusText;

          if (check.status === "pass") {
            statusText = "Pass";
          } else if (check.status === "warning") {
            statusText = "Warning";
          } else {
            statusText = "Missing";
          }

          card.innerHTML = `

            <div class="result-top">

                <span class="result-name">
                    ${escapeHTML(check.name)}
                </span>

                <span class="result-status">
                    ${statusText}
                </span>

            </div>

            ${
              check.value
                ? `
                    <div class="result-value">
                        ${escapeHTML(check.value)}
                    </div>
                    `
                : ""
            }

            ${
              check.note
                ? `
                    <div class="result-note">
                        ${escapeHTML(check.note)}
                    </div>
                    `
                : ""
            }

        `;

          container.appendChild(card);
        });

        container.style.display = "flex";
      }

      function escapeHTML(value) {
        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;
      }
    </script>
  </body>
</html>
